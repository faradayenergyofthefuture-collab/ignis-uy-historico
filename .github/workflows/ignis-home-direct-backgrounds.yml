name: IGNIS home WebP render verification

on:
  push:
    branches:
      - fix/ignis-home-backgrounds-direct-20261109
  pull_request:
    paths:
      - "ignis_visual.py"
      - "tests/test_ignis_local_backgrounds.py"
      - "tests/test_ignis_approved_landing.py"
      - ".github/workflows/ignis-home-direct-backgrounds.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall -q ignis_visual.py ignis_historico.py
      - name: Verify direct image mapping and prior UI tests
        run: |
          python -m unittest discover -s tests -p 'test_ignis_local_backgrounds.py' -v
          python -m unittest discover -s tests -p 'test_ignis_approved_landing.py' -v
          python -m unittest discover -s tests -p 'test_ignis_icon_hero.py' -v
          python -m unittest discover -s tests -p 'test_ignis_visual.py' -v
