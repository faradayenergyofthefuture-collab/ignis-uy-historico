name: IGNIS scientific checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    paths:
      - "ignis_sensibilidad.py"
      - "ignis_historico.py"
      - "tests/test_ignis_sensibilidad.py"
      - ".github/workflows/ignis-science.yml"

permissions:
  contents: read

jobs:
  science-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install numpy pandas
      - name: Compile Python sources
        run: python -m py_compile ignis_sensibilidad.py ignis_historico.py
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -p 'test_ignis_sensibilidad.py' -v
