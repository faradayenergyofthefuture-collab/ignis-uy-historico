name: IGNIS premium layout checks

on:
  push:
    branches:
      - feature/ignis-premium-edge-to-edge-20261108
  pull_request:
    paths:
      - "ignis_visual.py"
      - "ignis_historico.py"
      - "tests/test_ignis_premium_layout.py"
      - ".github/workflows/ignis-premium-layout.yml"

jobs:
  premium-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python source syntax
        run: python -m compileall -q ignis_visual.py ignis_historico.py
      - name: Check premium layout and mobile rules
        run: python -m unittest discover -s tests -p 'test_ignis_premium_layout.py' -v
      - name: Run existing UI smoke tests
        run: python -m unittest discover -s tests -p 'test_ignis_visual.py' -v
