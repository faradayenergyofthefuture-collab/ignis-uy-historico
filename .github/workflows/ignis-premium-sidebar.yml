name: IGNIS premium sidebar checks

on:
  push:
    branches:
      - feature/ignis-premium-sidebar-20261109
  pull_request:
    paths:
      - "ignis_historico.py"
      - "ignis_visual.py"
      - "tests/test_ignis_premium_sidebar.py"
      - ".github/workflows/ignis-premium-sidebar.yml"

jobs:
  sidebar-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax validation
        run: python -m compileall -q ignis_historico.py ignis_visual.py
      - name: Test sidebar navigation and CSS
        run: python -m unittest discover -s tests -p 'test_ignis_premium_sidebar.py' -v
      - name: Existing visual tests
        run: |
          python -m unittest discover -s tests -p 'test_ignis_visual.py' -v
          python -m unittest discover -s tests -p 'test_ignis_premium_layout.py' -v
